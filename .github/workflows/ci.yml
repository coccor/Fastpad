name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the whole suite before building a release.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run still in progress. Runs on main and
# release tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Caches hold only dependencies; incremental artifacts of the crate itself would be thrown away.
  CARGO_INCREMENTAL: 0

jobs:
  unit-linux:
    # The library is Windows-only today, so Linux runs formatting and a Windows-target Clippy
    # type-check (no linking). It is the only Clippy run: a Windows host would check the same target
    # with the same flags. Unit and integration tests execute in windows-tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Windows MSVC target for type-checking
        run: rustup target add x86_64-pc-windows-msvc
      - name: Format check
        run: cargo fmt --all -- --check
      # Caches are saved only from main; pull requests restore main's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (x86_64-pc-windows-msvc type-check, warnings denied)
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings

  windows-tests:
    # The suite is split across runners: in_process and markdown_live each `include!` lib.rs, so each
    # reruns the library's unit tests and takes about as long as the library's own run. Within a
    # shard the Windows tests still run serially.
    strategy:
      fail-fast: false
      matrix:
        shard: [unit-and-integration, in_process, markdown_live]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-dlls
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 'unit-and-integration' }}
      - name: Unit and Windows integration tests (serial)
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $selection = if ($env:SHARD -ne "unit-and-integration") {
            @("--test", $env:SHARD)
          } else {
            # Every test target except the ones with a shard of their own, read from Cargo.toml so a
            # new [[test]] cannot be left out.
            $sharded = @("in_process", "markdown_live")
            $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
            $targets = ($metadata.packages | Where-Object name -eq "fastpad").targets
            $tests = @($targets | Where-Object { $_.kind -contains "test" -and $sharded -notcontains $_.name } | ForEach-Object { "--test"; $_.name })
            @("--lib", "--bins") + $tests
          }
          cargo test --locked --target x86_64-pc-windows-msvc @selection -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-integration:
    # The required status check on main: passes only when every windows-tests shard passed.
    needs: windows-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Windows test shards passed
        run: test "${{ needs.windows-tests.result }}" = success

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locked dependency audit
        shell: pwsh
        run: ./tools/audit-dependencies.ps1

  # package, benchmark-trend and live-perf build release binaries, so they start alongside the tests
  # instead of after them; a test failure still fails the run.
  package:
    needs: dependency-audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned native source archives
        uses: actions/cache@v4
        with:
          path: native/cache
          key: native-archives-${{ hashFiles('native/dependencies.json') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/package"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build portable ZIP
        shell: pwsh
        run: ./tools/package.ps1
      - name: Verify portable ZIP
        shell: pwsh
        run: ./tools/verify-package.ps1
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: ./tools/install-inno-setup.ps1
      - name: Build per-user installer
        shell: pwsh
        run: ./tools/package-installer.ps1
      - name: Verify per-user installer
        shell: pwsh
        run: ./tools/verify-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FastPad-windows-x64
          path: |
            dist/FastPad-*-windows-x64.zip
            dist/FastPad-*-windows-x64.sha256
            dist/FastPad-*-windows-x64-setup.exe
          if-no-files-found: error

  benchmark-trend:
    # Hosted runners are noisy and unrepresentative: samples are uploaded for trend comparison only.
    # Absolute millisecond thresholds are enforced only on the documented reference machine.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-dlls
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release binaries
        run: cargo build --locked --release --bins
      - name: Collect 30 startup samples
        run: cargo run --locked --release --bin fastpad-bench -- --runs 30 --warmup 5 --output benchmarks/trend.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-trend-${{ github.sha }}
          path: benchmarks/trend.jsonl
          if-no-files-found: error

  live-perf:
    # The Live Markdown view's typing latency (Live editor phase 4 plan, Decision 9): each
    # scenario's keystroke p95 is held to the 4 ms budget, scaled because hosted runners are
    # slower than the reference machine and draw without a GPU. The p95s go to the job summary.
    runs-on: windows-latest
    env:
      FASTPAD_PERF_SCALE: "2.5"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-dlls
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Filtered to the typing_in_live tests: a bare --ignored would also run the asset
      # regeneration tests.
      - name: Live typing scenarios (release, serial)
        shell: pwsh
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc --test markdown_live typing_in_live -- --ignored --test-threads=1 --nocapture | Tee-Object -FilePath live-perf.txt
          $status = $LASTEXITCODE
          "## Live typing" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Select-String -Path live-perf.txt -Pattern 'live-perf |paint: present' | ForEach-Object { $_.Line.Trim() } >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          exit $status
