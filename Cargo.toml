[package]
name = "fastpad"
version = "0.5.0"
edition = "2024"
description = "Ultra fast note taking app."
license = "MIT"
repository = "https://github.com/coccor/FastPad"

[dependencies]
serde_json = "=1.0.151"
pulldown-cmark = { version = "=0.13.4", default-features = false }
regex = "=1.13.1"
windows = { version = "=0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-numerics = { version = "=0.3.1", default-features = false }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }

[features]
# Portable-package builds resolve Scintilla.dll only beside FastPad.exe.
release-package = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The SVG stack, which only resvg pulls in, optimizes for size: it runs on the image worker
# thread, off the startup path. Measured 2026-11-04 (static CRT, fat LTO): fastpad.exe
# 8,289,792 -> 7,780,352 bytes; a 256 px icon decode 473 -> 550 us median.
# Re-list the crates when resvg's dependencies change: `cargo tree -p resvg -e normal`.
[profile.release.package]
adler2 = { opt-level = "s" }
arrayref = { opt-level = "s" }
arrayvec = { opt-level = "s" }
base64 = { opt-level = "s" }
bytemuck = { opt-level = "s" }
byteorder-lite = { opt-level = "s" }
color_quant = { opt-level = "s" }
crc32fast = { opt-level = "s" }
data-url = { opt-level = "s" }
fdeflate = { opt-level = "s" }
flate2 = { opt-level = "s" }
float-cmp = { opt-level = "s" }
font-types = { opt-level = "s" }
fontdb = { opt-level = "s" }
gif = { opt-level = "s" }
harfrust = { opt-level = "s" }
image-webp = { opt-level = "s" }
imagesize = { opt-level = "s" }
kurbo = { opt-level = "s" }
memmap2 = { opt-level = "s" }
miniz_oxide = { opt-level = "s" }
png = { opt-level = "s" }
polycool = { opt-level = "s" }
read-fonts = { opt-level = "s" }
resvg = { opt-level = "s" }
rgb = { opt-level = "s" }
roxmltree = { opt-level = "s" }
simd-adler32 = { opt-level = "s" }
simplecss = { opt-level = "s" }
siphasher = { opt-level = "s" }
skrifa = { opt-level = "s" }
slotmap = { opt-level = "s" }
smallvec = { opt-level = "s" }
strict-num = { opt-level = "s" }
svgtypes = { opt-level = "s" }
tiny-skia = { opt-level = "s" }
tiny-skia-path = { opt-level = "s" }
tinyvec = { opt-level = "s" }
unicode-bidi = { opt-level = "s" }
unicode-script = { opt-level = "s" }
unicode-vo = { opt-level = "s" }
usvg = { opt-level = "s" }
weezl = { opt-level = "s" }
xmlwriter = { opt-level = "s" }
zune-core = { opt-level = "s" }
zune-jpeg = { opt-level = "s" }

# Dependencies keep line tables (backtraces, breakpoints by line) but not full debug info,
# which shrinks what every dev and test binary links.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "thin"

[profile.release-thin]
inherits = "release"
opt-level = 3
lto = "thin"

[[test]]
name = "acceptance"
path = "tests/windows/acceptance.rs"

[[test]]
name = "editor_control"
path = "tests/windows/editor_control.rs"

[[test]]
name = "startup_smoke"
path = "tests/windows/startup_smoke.rs"

[[test]]
name = "titlebar"
path = "tests/windows/titlebar.rs"

[[test]]
name = "tabs"
path = "tests/windows/tabs.rs"

[[test]]
name = "highlighting"
path = "tests/windows/highlighting.rs"

[[test]]
name = "recovery"
path = "tests/windows/recovery.rs"

[[test]]
name = "single_instance"
path = "tests/windows/single_instance.rs"

[[test]]
name = "session"
path = "tests/windows/session.rs"

[[test]]
name = "library"
path = "tests/windows/library.rs"

[[test]]
name = "markdown_live"
path = "tests/windows/markdown_live.rs"

# The other tests that build the crate in-process with cfg(test), in one target so it compiles once.
[[test]]
name = "in_process"
path = "tests/windows/in_process.rs"
